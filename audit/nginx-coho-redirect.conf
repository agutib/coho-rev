server {
    listen 443 ssl http2;
    server_name coho.arnoldgutib.pro;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/arnoldgutib.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arnoldgutib.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    return 301 https://rev.arnoldgutib.pro$request_uri;
}

server {
    listen 80;
    server_name coho.arnoldgutib.pro;
    server_tokens off;
    return 301 https://rev.arnoldgutib.pro$request_uri;
}
