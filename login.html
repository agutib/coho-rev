<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COHO OpsHub | Sign In</title>

  <script>
    (function() {
      const saved = localStorage.getItem('coho_theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && prefersDark)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center antialiased selection:bg-emerald-500 selection:text-white relative transition-colors duration-200">

  <!-- Theme Toggle in top-right corner -->
  <div class="absolute top-6 right-6">
    <button id="themeToggleBtn" onclick="Theme.toggle()"
      class="theme-toggle-btn p-2 rounded-xl bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 shadow-xs transition-colors"
      title="Toggle Light/Dark Theme">
      <span>🌙</span>
    </button>
  </div>

  <div class="w-full max-w-sm px-4">
    <div class="flex flex-col items-center mb-8">
      <div class="w-14 h-14 rounded-2xl bg-emerald-600 flex items-center justify-center text-white font-black text-2xl shadow-lg shadow-emerald-500/25 mb-4">C</div>
      <h1 class="text-xl font-bold text-slate-900 dark:text-white">COHO OpsHub</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">UK HMO Property Operations</p>
    </div>

    <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm shadow-slate-900/5 p-8 transition-colors duration-200">
      <h2 class="text-base font-semibold text-slate-900 dark:text-white mb-1">Sign in</h2>
      <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">Enter your access password to continue.</p>
      <form id="loginForm" onsubmit="handleLogin(event)" autocomplete="off">
        <div class="space-y-4">
          <div>
            <label for="password" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5 uppercase tracking-wide">Password</label>
            <input id="password" type="password" placeholder="Enter password" autocomplete="current-password"
              class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-sm text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-shadow">
          </div>
          <div id="errorMsg" class="hidden text-sm text-rose-600 dark:text-rose-400 bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-900 rounded-lg px-3.5 py-2.5">
            Incorrect password. Please try again.
          </div>
          <button type="submit" id="submitBtn"
            class="w-full py-2.5 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white text-sm font-semibold transition-colors shadow-sm shadow-emerald-500/20 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2">
            Sign In
          </button>
        </div>
      </form>
    </div>
    <p class="text-center text-xs text-slate-400 dark:text-slate-500 mt-6">Private access only &middot; COHO OpsHub</p>
  </div>

  <script src="assets/theme.js"></script>
  <script>
    // SHA-256 of: coho@2026!
    const PASS_HASH = 'c3f89002f28c39474375003faf4f51cccce5a77b515696194ba280c3b5ee4f10';

    if (sessionStorage.getItem('coho_auth') === 'true') {
      window.location.replace('index.html');
    }

    async function sha256(message) {
      const msgBuffer = new TextEncoder().encode(message);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function handleLogin(e) {
      e.preventDefault();
      const input = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');
      const submitBtn = document.getElementById('submitBtn');

      if (!input) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying...';

      const hash = await sha256(input);

      if (hash === PASS_HASH) {
        sessionStorage.setItem('coho_auth', 'true');
        sessionStorage.setItem('coho_auth_time', Date.now().toString());
        window.location.replace('index.html');
      } else {
        errorMsg.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
      }
    }
  </script>
</body>
</html>
